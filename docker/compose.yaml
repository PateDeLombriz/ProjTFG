
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_USER: ${DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data #Amb django tmb es pot fer servir sqlite, pero per utilitzar la bd externa es necessari postgres.
      - ../postgres/db-init:/docker-entrypoint-initdb.d
    env_file:
      - .env

  django-web:
    build:
      context: ../back_end
    container_name: django-docker
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ../back_end:/app
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DEBUG: ${DEBUG}
      DJANGO_LOGLEVEL: ${DJANGO_LOGLEVEL}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS}
      DATABASE_ENGINE: ${DATABASE_ENGINE}
      DATABASE_NAME: ${DATABASE_NAME}
      DATABASE_USERNAME: ${DATABASE_USERNAME}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      DATABASE_HOST: ${DATABASE_HOST}
      DATABASE_PORT: ${DATABASE_PORT}
    env_file:
      - .env

  flutter-web:
    build:
      context: ../front_end
      dockerfile: Dockerfile
    container_name: flutter-docker
    ports:
      - "9000:9000"
    volumes:
      - ../front_end:/home/developer/app
    working_dir: /home/developer/app
    command: flutter run -d web-server --web-port=9000 --web-hostname=0.0.0.0
    depends_on:
      - django-web
    user: "1000:1000"

volumes:
  postgres_data:
